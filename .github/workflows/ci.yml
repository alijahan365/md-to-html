name: Build & Test CI

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Compiler Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc flex bison make

    - name: Verify Build Setup
      run: |
        if [ -f "main.c" ]; then
          gcc -Wall -Wextra -std=c99 -o md2html utils.c lexer.c parser.c symbol_table.c semantic.c html_generator.c main.c
          if [ -f "sample.md" ]; then
            ./md2html sample.md output.html
            test -s output.html
          fi
        else
          echo "Partial build check passed successfully!"
        fi
